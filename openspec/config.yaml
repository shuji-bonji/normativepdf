schema: spec-driven

# PDF family 共通の前提（pdf-agent-stack/docs/specs/31 付録 A）と、normativepdf 固有の境界ルール。
# すべての成果物（proposal / specs / design / tasks）のプロンプトに <context> として注入される。
# 🔴 rules の項目は必ず引用符で囲む。文中の「approved: 」のような「コロン + 空白」を YAML が入れ子と読み、
#    openspec が「could not parse config.yaml」と警告して context と rules を丸ごと捨てる（pdf-reader-mcp で実際に起きた）。
context: |
  このリポジトリは条文駆動の PDF ライブラリ（normativepdf。純 TypeScript・構造層・低レベル API だけ）。
  すべての挙動を ISO 32000 の条項に紐づけ、紐づけられないものは主張しない。高レベル API は持たない
  （@normativepdf/document と MCP 側の仕事）。パーサは持つが抽出はしない。自前の検証器を持たず、
  採点は pdf-verify-mcp（veraPDF）、読み戻しは独立実装（qpdf --check / poppler）で行う（docs/GUARDS.md T-2）。
  実装仕様を決める前に、必ず pdf-spec-mcp で ISO 32000-1/-2・TS 32001〜32005 の原文を確かめ、
  条項番号を推測で書かない（引けなかったら引けなかったと書く）。ライブラリの都合・慣習と仕様の要求を分けて書く。
  条文に反する入力は受け取らずに例外を投げる（回復は @normativepdf/recover の仕事）。出力は時刻・乱数に依存しない。
  仕様は openspec/specs/<capability>/spec.md が正本で、日本語で書く。capability は src の層の単位
  （syntax / file / filter / encrypt / serialize / doc / text / font / struct / content / conformance）で、
  ディレクトリ名と同じ名前にする。ISO の節番号は capability の名前ではなく、各要求の根拠に書く。
  docs/ROADMAP.md・docs/DESIGN.md・docs/GUARDS.md・docs/adr/ は設計の正典として残し、正本の要求とは二重にしない
  （要求は「この版で何を保証するか」、ADR は「なぜそう決めたか」）。
  要求の見出しは「### Requirement: SPEC-NORMATIVEPDF-<機能>-<3 桁> 題」で、ID は `npx spec-ids next <capability>` で採る
  （一度使った番号は再利用しない）。文末に（SHALL）を付ける。
  テストは tests/**/*.test.ts（vitest）で、CI の check ジョブで全件が回る。コーパス（veraPDF-corpus）の回帰は
  別ジョブで、受入テストの代わりにしない。受入テストの it / describe の名前に仕様 ID を書く。
  `npx spec-ids check` が仕様 ID とテスト名を突き合わせ、CI（spec-gate）で止める。

rules:
  proposal:
    - "先頭に front matter を置く（approved: と pr: は空のキー、implementation: required か none、targets: [capability, ...]）。approved と pr は人がマージの前に書く"
    - "Capabilities には openspec/specs/ にある既存の capability 名（src の層の名前）をそのまま使う。まだ正本の無い層を触るときは、その層の既存のテストを読んで、起こす範囲を書く"
    - "本文に「変わる振る舞い / 変わらない振る舞い / 対象外 / 人が判断すること」を書く"
    - "公開 API（src/index.ts の export）が変わるかを書く。変わるなら minor か major かを書く"
  specs:
    - "各 Requirement の見出しは「### Requirement: SPEC-NORMATIVEPDF-<機能>-<3 桁> 題」。ID は `npx spec-ids next <capability>` で採り、再利用しない"
    - "各 Requirement に「#### Scenario:」を 1 つ以上書く。Scenario 名はそのままテスト名の後半になるので、WHEN / THEN が読める名前にする"
    - "文末に（SHALL）を付ける。Purpose は 50 文字以上"
    - "根拠は規格の節番号（例: ISO 32000-2 §7.5.4、§7.3.10）で書く。pdf-spec-mcp で引けなかった条項は、引けなかったと書く"
    - "条文に反する入力について、受け取るか例外を投げるかと、投げる例外の型を書く"
  design:
    - "ライブラリの都合と仕様の制約を分けて書く"
    - "読み（parse）と書き（serialize）で振る舞いが変わるなら、両方を書く"
    - "受入をどの独立実装（qpdf / poppler / veraPDF / 差分オラクル）で測るかを書く"
  tasks:
    - "テストの describe / it の名前に仕様 ID と Scenario 名を書くタスクを含める"
    - "期待値を仕様 ID のために変えない"
    - "最後に「npx openspec validate --all && npx spec-ids check が通る」を確かめるタスクを置く"
    - "新しい capability を作る変更は、archive の後に正本の先頭へ front matter（spec_id / introduced_by）を書き足すタスクを置く（OpenSpec 1.14.1 は差分の front matter を写さない）"

operations:
  archive:
    guidance:
      - "archive の前に proposal.md の front matter の approved と pr が埋まっていることを確かめ、空なら止まって人に求める"
      - "archive はマージの前に、同じ PR の中で行う（実装 PR は openspec/changes/<slug>/ の追加を pr-scope が通さない）"
      - "archive の後に npx spec-ids check を実行し、OK を確かめる"
